<!DOCTYPE html>
<!--
RAD-LINK KENYA — COMPLETE SINGLE-FILE PROTOTYPE
Demonstration only: forms do not send data to a server.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="RAD-LINK Kenya connects radiology professionals, healthcare facilities, employers, equipment manufacturers, suppliers and technical service providers.">
<title>RAD-LINK Kenya | Imaging Workforce & Industry Connect</title>
<style>
:root {
  --navy: #10253f;
  --blue: #1769aa;
  --cyan: #19a7b8;
  --gold: #f1b84b;
  --ink: #17283b;
  --muted: #617184;
  --paper: #f4f7fb;
  --white: #ffffff;
  --line: #dce5ee;
  --green: #18856b;
  --radius: 18px;
  --shadow: 0 12px 32px rgba(16,37,63,.09);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 90px; }
body {
  margin: 0;
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
    "Segoe UI", sans-serif;
  color: var(--ink);
  background: var(--paper);
  line-height: 1.6;
}
a { color: inherit; }
button, input, select, textarea { font: inherit; }
button, .btn { cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible,
select:focus-visible, textarea:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 3px;
}
.container { width: min(1160px, 92%); margin-inline: auto; }
section { padding: 76px 0; }
.section-heading { max-width: 760px; margin-bottom: 32px; }
.eyebrow {
  display: inline-block; color: var(--blue); font-size: .76rem;
  font-weight: 800; letter-spacing: .13em; text-transform: uppercase;
}
h1, h2, h3 { line-height: 1.18; margin-top: 0; }
h1 { font-size: clamp(2.4rem, 6vw, 4.5rem); letter-spacing: -.045em; }
h2 { font-size: clamp(1.8rem, 4vw, 2.8rem); letter-spacing: -.025em; }
h3 { font-size: 1.15rem; }
p { margin-top: 0; }
.muted, .small { color: var(--muted); }
.small { font-size: .88rem; }
.topbar {
  background: var(--navy); color: #eaf3fb; padding: 8px 0;
  font-size: .8rem;
}
.topbar-inner { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
header {
  position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.96);
  border-bottom: 1px solid var(--line); backdrop-filter: blur(14px);
}
.navbar { min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
.brand { display: flex; align-items: center; gap: 11px; text-decoration: none; font-weight: 900; letter-spacing: -.03em; }
.brand-mark {
  width: 42px; height: 42px; border-radius: 13px; display: grid;
  place-items: center; color: white; background: linear-gradient(135deg,var(--blue),var(--cyan));
  font-size: 1.05rem;
}
.brand small { display: block; color: var(--muted); font-size: .66rem; font-weight: 700; letter-spacing: .08em; }
.navlinks { display: flex; align-items: center; gap: 19px; }
.navlinks a { text-decoration: none; font-size: .88rem; font-weight: 700; }
.navlinks a:hover { color: var(--blue); }
.menu-toggle { display: none; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: white; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 18px; border: 1px solid transparent; border-radius: 11px;
  font-weight: 800; text-decoration: none; transition: .18s ease;
}
.btn:hover { transform: translateY(-1px); }
.btn-primary { color: white; background: var(--blue); }
.btn-primary:hover { background: #10558c; }
.btn-light { background: white; border-color: var(--line); color: var(--navy); }
.btn-gold { background: var(--gold); color: var(--navy); }
.btn-outline { border-color: rgba(255,255,255,.45); color: white; background: transparent; }
.hero {
  color: white; padding: 86px 0 74px;
  background:
    radial-gradient(circle at 84% 15%, rgba(25,167,184,.28), transparent 27%),
    radial-gradient(circle at 8% 90%, rgba(23,105,170,.4), transparent 35%),
    linear-gradient(120deg,#0b1c32,#123b60 65%,#126c82);
  overflow: hidden;
}
.hero-grid { display: grid; grid-template-columns: 1.15fr .85fr; align-items: center; gap: 52px; }
.hero .eyebrow { color: #7de1e7; }
.hero h1 { margin: 17px 0 22px; }
.hero p { color: #d7e5f1; font-size: 1.08rem; max-width: 660px; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
.hero-card {
  border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.09);
  border-radius: 24px; padding: 26px; box-shadow: 0 25px 65px rgba(0,0,0,.16);
}
.hero-card h3 { color: #fff; }
.hero-card p { font-size: .9rem; }
.hero-stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
.hero-stat { padding: 16px; background: rgba(255,255,255,.09); border-radius: 14px; }
.hero-stat strong { display: block; font-size: 1.55rem; color: #fff; }
.hero-stat span { font-size: .78rem; color: #d7e5f1; }
.trust-note { font-size: .82rem !important; margin-top: 20px; }
